
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You Olivia ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #ffb6d9, #ff4f9a 45%, #9c1455);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* delikatne błyski w tle */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.5) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.4) 0 2px, transparent 3px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,.4) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 75%, rgba(255,255,255,.5) 0 2px, transparent 3px);
    background-size: 180px 180px;
    animation: sparkle 4s linear infinite;
}

@keyframes sparkle {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-180px);
    }
}

/* główne serce */
.heart {
    position: relative;
    width: 330px;
    height: 330px;
    background: linear-gradient(145deg, #ff8fc4, #ff247f);
    transform: rotate(-45deg);
    border-radius: 35px;
    box-shadow:
        0 0 30px #ff4b9b,
        0 0 70px rgba(255, 55, 145, .8),
        inset 10px 10px 25px rgba(255,255,255,.35);

    animation: heartbeat 1.25s infinite;
}

/* górne części serca */
.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 330px;
    height: 330px;
    background: inherit;
    border-radius: 50%;
}

.heart::before {
    top: -165px;
    left: 0;
}

.heart::after {
    left: 165px;
    top: 0;
}

@keyframes heartbeat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }

    15% {
        transform: rotate(-45deg) scale(1.08);
    }

    30% {
        transform: rotate(-45deg) scale(1);
    }

    45% {
        transform: rotate(-45deg) scale(1.06);
    }

    60% {
        transform: rotate(-45deg) scale(1);
    }
}

/* napis */
.text {
    position: absolute;
    z-index: 5;
    text-align: center;
    color: white;
    text-shadow:
        0 0 5px #ff4b9b,
        0 0 15px #ff0080,
        2px 2px 5px rgba(120,0,50,.5);

    animation: textPulse 1.25s infinite;
}

.text .love {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 3px;
}

.text .name {
    margin-top: 8px;
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 2px;
}

.text .small-heart {
    font-size: 30px;
    margin-top: 5px;
}

@keyframes textPulse {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.08);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.05);
    }

    60% {
        transform: scale(1);
    }
}

/* latające serduszka */
.floating-heart {
    position: absolute;
    bottom: -50px;
    color: #ffb6da;
    font-size: 25px;
    animation: floatUp linear forwards;
    pointer-events: none;
    text-shadow: 0 0 10px #fff;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(.5) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) scale(1.3) rotate(360deg);
        opacity: 0;
    }
}

/* małe gwiazdki */
.star {
    position: absolute;
    color: white;
    animation: twinkle 1.5s infinite alternate;
    z-index: 2;
}

@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* telefon */
@media (max-width: 600px) {
    .heart {
        width: 230px;
        height: 230px;
    }

    .heart::before,
    .heart::after {
        width: 230px;
        height: 230px;
    }

    .heart::before {
        top: -115px;
    }

    .heart::after {
        left: 115px;
    }

    .text .love {
        font-size: 34px;
    }

    .text .name {
        font-size: 25px;
    }

    .text .small-heart {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="heart"></div>

<div class="text">
    <div class="love">I LOVE YOU</div>
    <div class="name">OLIVIA</div>
    <div class="small-heart">♥</div>
</div>

<script>

// latające serduszka
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const symbols = ["♥", "♡", "❤", "💕", "💗"];

    heart.innerHTML =
        symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 350);


// gwiazdki
function createStar() {

    const star = document.createElement("div");

    star.className = "star";
    star.innerHTML = "✦";

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.top =
        Math.random() * 100 + "vh";

    star.style.fontSize =
        (8 + Math.random() * 15) + "px";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    document.body.appendChild(star);

    setTimeout(() => {
        star.remove();
    }, 3000);
}

setInterval(createStar, 250);

</script>

</body>
</html>
